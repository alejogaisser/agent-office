<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Office</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="stage">
        <canvas id="scene"></canvas>
        <div id="overlay"></div>
        <div id="sign"></div>
        <div id="viewctl">
          <button id="rot-left" type="button" title="Rotate left">&#x27F2;</button>
          <button id="fit" type="button" title="Fit to view">Fit</button>
          <button id="rot-right" type="button" title="Rotate right">&#x27F3;</button>
        </div>
        <div id="empty" hidden></div>
        <div id="tooltip" hidden></div>
        <pre id="debug" hidden></pre>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
