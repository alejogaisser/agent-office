[package]
name = "office-core"
version = "0.1.0"
edition = "2021"
description = "Discovery, tail reading, parsing and state model for Agent Office"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
